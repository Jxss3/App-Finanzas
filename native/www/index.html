<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" id="metaTheme" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Finanzas" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Finanzas por Quincena — Registro de Gastos e Ingresos</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f9;
    --surface: #ffffff;
    --surface-2: #eef0f6;
    --text: #12172b;
    --text-2: #565d72;
    --text-3: #6f768a;
    --border: #e5e8f0;
    --primary: #3d5bf0;
    --primary-solid: #3d5bf0;
    --primary-soft: #e9edfe;
    --ingreso: #0a7f58;
    --ingreso-soft: #e2f5ee;
    --gasto: #c9264a;
    --gasto-soft: #fce9ed;
    --aviso: #a86500;
    --bar-muted: #cfd4e2;
    --tabbar: rgba(255, 255, 255, 0.88);
    --shadow: 0 16px 40px rgba(18, 23, 43, 0.14);
    --shadow-sm: 0 1px 2px rgba(18, 23, 43, 0.05);
    --radius: 20px;
    --radius-sm: 12px;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }

  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0e17;
    --surface: #141926;
    --surface-2: #1e2435;
    --text: #eef1f8;
    --text-2: #a9b1c3;
    --text-3: #8f97aa;
    --border: #262d40;
    --primary: #8ea1ff;
    --primary-solid: #4f6ef7;
    --primary-soft: #1e2647;
    --ingreso: #3dd6a0;
    --ingreso-soft: #10302a;
    --gasto: #fb8398;
    --gasto-soft: #37171f;
    --aviso: #f5b84a;
    --bar-muted: #333b52;
    --tabbar: rgba(20, 25, 38, 0.88);
    --shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { max-width: 100%; overflow-x: clip; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  body.bloqueado { overflow: hidden; }

  button, input, select { touch-action: manipulation; font-family: inherit; }
  button { cursor: pointer; border: none; background: none; color: inherit; font-size: inherit; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; display: block; }
  .hidden { display: none !important; }

  .app {
    max-width: 560px; margin: 0 auto;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom));
  }

  /* Encabezado */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .topbar .saludo { font-size: 1.45rem; font-weight: 750; letter-spacing: -0.03em; line-height: 1.2; }
  .topbar .fecha { font-size: 0.82rem; color: var(--text-2); }
  .topbar .fecha::first-letter { text-transform: uppercase; }
  .btn-redondo {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    transition: transform .12s;
  }
  .btn-redondo:active { transform: scale(.93); }

  /* Navegación de quincena */
  .periodo-nav { display: flex; align-items: center; gap: 4px; margin-bottom: 14px; }
  .periodo-nav .arrow { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); flex-shrink: 0; }
  .periodo-nav .arrow:active { background: var(--surface-2); }
  .periodo { flex: 1; min-width: 0; text-align: center; line-height: 1.25; }
  .periodo-nombre { display: block; font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; }
  .periodo-rango { display: block; font-size: 0.76rem; color: var(--text-2); }
  .periodo-rango::first-letter { text-transform: uppercase; }
  .chip-hoy {
    font-size: 0.76rem; font-weight: 700; color: var(--primary); background: var(--primary-soft);
    padding: 6px 12px; border-radius: 999px; flex-shrink: 0;
  }

  /* Vistas */
  .view { display: none; }
  .view.activa { display: block; animation: entrar .28s var(--ease) both; }
  @keyframes entrar { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Tarjeta principal de balance */
  .hero {
    position: relative; overflow: hidden; color: #fff;
    border-radius: 24px; padding: 20px 20px 16px; margin-bottom: 12px;
    background: linear-gradient(150deg, #1a2159 0%, #2b3bb0 62%, #3d5bf0 100%);
    box-shadow: 0 14px 30px rgba(35, 50, 150, 0.28);
  }
  .hero::after {
    content: ""; position: absolute; width: 230px; height: 230px; right: -80px; top: -110px;
    border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.13);
    box-shadow: 0 0 0 42px rgba(255, 255, 255, 0.035), 0 0 0 84px rgba(255, 255, 255, 0.025);
    pointer-events: none;
  }
  .hero .etiqueta { font-size: 0.82rem; font-weight: 600; color: rgba(255, 255, 255, 0.78); }
  .hero .monto { font-size: 2.65rem; font-weight: 750; letter-spacing: -0.035em; line-height: 1.12; margin-top: 2px; }
  .hero .monto.largo { font-size: 2rem; }
  .hero .monto small { font-size: .56em; font-weight: 600; color: rgba(255, 255, 255, 0.68); letter-spacing: -0.02em; }
  .hero .estado { font-size: 0.82rem; color: rgba(255, 255, 255, 0.86); margin-top: 4px; min-height: 1.2em; }
  .hero-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; position: relative; z-index: 1; }
  .hero-col { background: rgba(255, 255, 255, 0.11); border-radius: 14px; padding: 10px 12px; min-width: 0; }
  .hero-col .t { display: flex; align-items: center; gap: 5px; font-size: 0.74rem; color: rgba(255, 255, 255, 0.8); }
  .hero-col .t .ico { width: 14px; height: 14px; stroke-width: 2.2; }
  .hero-col .v { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; line-height: 1.25; margin-top: 1px; }
  .hero-col .v.largo { font-size: 0.8rem; }

  /* Tarjetas */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  .card-head h2 { font-size: 0.98rem; font-weight: 700; letter-spacing: -0.015em; }
  .link { font-size: 0.82rem; font-weight: 600; color: var(--primary); padding: 4px 0 4px 8px; }

  /* Presupuesto */
  .budget-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .budget-top .t { font-size: 1.02rem; font-weight: 700; letter-spacing: -0.02em; }
  .budget-top .p { font-size: 0.84rem; font-weight: 700; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .budget-top .p.warn { color: var(--aviso); }
  .budget-top .p.over { color: var(--gasto); }
  .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 10px 0 8px; }
  .bar .fill { height: 100%; border-radius: 999px; background: var(--primary-solid); transition: width .5s var(--ease), background .3s; }
  .bar .fill.warn { background: #e0900c; }
  .bar .fill.over { background: #d93355; }
  .budget-sub { font-size: 0.8rem; color: var(--text-2); }
  .budget-vacio { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
  .budget-vacio .t { font-size: 0.9rem; font-weight: 650; display: block; }
  .budget-vacio .s { font-size: 0.78rem; color: var(--text-2); display: block; }
  .budget-vacio .txt { flex: 1; min-width: 0; }
  .budget-vacio > .ico { color: var(--text-3); width: 18px; height: 18px; }
  .tile-ico { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex-shrink: 0; color: var(--primary); background: var(--primary-soft); }

  /* Movimientos */
  .txn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 0; text-align: left; border-radius: 12px; }
  .txn:active { opacity: .6; }
  .cat-ico {
    width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex-shrink: 0;
    color: var(--c, var(--text-2));
    background: color-mix(in srgb, var(--c, #64748b) 14%, transparent);
  }
  .cat-ico .ico { width: 20px; height: 20px; }
  .txn .info { flex: 1; min-width: 0; display: block; }
  .txn .desc { display: block; font-weight: 600; font-size: 0.92rem; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .txn .meta { display: block; font-size: 0.76rem; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .txn .amount { font-weight: 700; font-size: 0.93rem; white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .txn .amount.ingreso { color: var(--ingreso); }

  .tools { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .search { position: relative; }
  .search .ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-3); pointer-events: none; }
  .search input { padding-left: 40px; background: var(--surface); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: var(--radius-sm); }
  .seg button { color: var(--text-2); padding: 8px; font-size: 0.86rem; font-weight: 600; border-radius: 9px; transition: background .15s, color .15s; }
  .seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
  .seg button.active.ingreso { color: var(--ingreso); }
  .seg button.active.gasto { color: var(--gasto); }

  .dia { display: flex; justify-content: space-between; gap: 10px; font-size: 0.76rem; font-weight: 650; color: var(--text-2); padding: 12px 2px 4px; }
  .dia:first-child { padding-top: 0; }
  .dia span:first-child::first-letter { text-transform: uppercase; }
  .dia span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }

  .vacio { text-align: center; padding: 26px 12px; color: var(--text-2); font-size: 0.88rem; }
  .vacio .tile-ico { margin: 0 auto 10px; width: 48px; height: 48px; border-radius: 15px; }
  .vacio strong { display: block; color: var(--text); font-size: 0.96rem; letter-spacing: -0.01em; }
  .btn-primary {
    background: var(--primary-solid); color: #fff; font-weight: 650; font-size: 0.95rem;
    padding: 13px 18px; border-radius: 14px; transition: transform .1s, opacity .15s;
  }
  .btn-primary:active { transform: scale(.98); }
  .vacio .btn-primary { margin-top: 12px; font-size: 0.88rem; padding: 10px 16px; border-radius: 12px; }

  /* Análisis */
  .cat-row { padding: 8px 0; }
  .cat-row .top { display: flex; align-items: center; gap: 10px; }
  .cat-row .nombre { flex: 1; min-width: 0; font-size: 0.9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-row .amt { font-size: 0.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cat-row .pct { font-size: 0.76rem; color: var(--text-2); width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  .cat-row .bar { height: 6px; margin: 6px 0 0 50px; }
  .cat-row .cat-ico { width: 40px; height: 40px; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .stats .card { margin-bottom: 0; padding: 14px; min-width: 0; }
  .stat-t { font-size: 0.76rem; color: var(--text-2); font-weight: 600; }
  .stat-v { font-size: 1.22rem; font-weight: 750; letter-spacing: -0.025em; margin-top: 2px; overflow-wrap: anywhere; line-height: 1.2; }
  .stat-s { font-size: 0.74rem; color: var(--text-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .compara { display: flex; align-items: center; gap: 10px; font-size: 0.86rem; font-weight: 600; }
  .compara .ico { width: 18px; height: 18px; stroke-width: 2.2; }
  .compara.menos .ico { color: var(--ingreso); }
  .compara.mas .ico { color: var(--gasto); }

  .tendencia { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; align-items: end; }
  .tend-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 132px; padding: 0 2px; border-radius: 10px; }
  .tend-col .val { font-size: 0.68rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tend-col .barra { width: 100%; max-width: 26px; min-height: 2px; background: var(--bar-muted); border-radius: 4px 4px 0 0; transition: height .45s var(--ease); }
  .tend-col.sel .barra { background: var(--primary-solid); }
  .tend-col .lbl { font-size: 0.68rem; color: var(--text-2); margin-top: 6px; line-height: 1.15; text-align: center; font-variant-numeric: tabular-nums; }
  .tend-col.sel .lbl { color: var(--text); font-weight: 700; }

  /* Ajustes */
  .grupo-t { font-size: 0.76rem; font-weight: 650; color: var(--text-2); margin: 18px 4px 6px; }
  .grupo-t:first-of-type { margin-top: 2px; }
  .ajuste-lista { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .ajuste { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  .ajuste:last-child { border-bottom: none; }
  button.ajuste:active { background: var(--surface-2); }
  .ajuste .tile-ico { width: 36px; height: 36px; border-radius: 11px; background: var(--surface-2); color: var(--text-2); }
  .ajuste .tile-ico .ico { width: 19px; height: 19px; }
  .ajuste .txt { flex: 1; min-width: 0; }
  .ajuste .t { display: block; font-size: 0.92rem; font-weight: 600; }
  .ajuste .s { display: block; font-size: 0.76rem; color: var(--text-2); }
  .ajuste select, .ajuste input { width: 132px; flex-shrink: 0; padding: 8px 10px; text-align: right; }
  .ajuste.peligro .t { color: var(--gasto); }
  .ajuste.peligro .tile-ico { background: var(--gasto-soft); color: var(--gasto); }
  .switch { width: 46px; height: 28px; border-radius: 999px; background: var(--bar-muted); position: relative; flex-shrink: 0; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s var(--ease); }
  .switch.on { background: var(--primary-solid); }
  .switch.on::after { transform: translateX(18px); }
  .nota { font-size: 0.78rem; color: var(--text-2); text-align: center; padding: 16px 12px 0; }

  /* Campos */
  input, select {
    font-size: 16px; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 11px 12px; width: 100%;
    transition: border .15s, box-shadow .15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .field { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; }
  .field label, .field .lab { font-size: 0.78rem; font-weight: 600; color: var(--text-2); }

  /* Barra inferior */
  .tabbar {
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 30;
    width: 100%; max-width: 560px;
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    background: var(--tabbar); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 0; font-size: 0.66rem; font-weight: 600; color: var(--text-3); border-radius: 12px; transition: color .15s; }
  .tab.activa { color: var(--primary); }
  .tab .ico { width: 23px; height: 23px; }
  .fab {
    justify-self: center; width: 54px; height: 54px; margin-top: -22px; border-radius: 18px;
    display: grid; place-items: center; color: #fff; background: var(--primary-solid);
    box-shadow: 0 8px 18px rgba(61, 91, 240, 0.42); transition: transform .12s var(--ease);
  }
  .fab:active { transform: scale(.92); }
  .fab .ico { width: 26px; height: 26px; stroke-width: 2.2; }

  /* Hojas inferiores y diálogos */
  .backdrop {
    position: fixed; inset: 0; z-index: 50; background: rgba(9, 12, 24, 0.5);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; visibility: hidden; transition: opacity .22s, visibility .22s;
  }
  .backdrop.open { opacity: 1; visibility: visible; }
  .sheet {
    background: var(--surface); width: 100%; max-width: 560px;
    border-radius: 24px 24px 0 0; padding: 0 18px calc(18px + env(safe-area-inset-bottom));
    max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
    transform: translateY(100%); transition: transform .28s var(--ease);
  }
  .backdrop.open .sheet { transform: none; }
  .grab { position: sticky; top: 0; z-index: 2; background: var(--surface); padding: 9px 0 6px; touch-action: none; }
  .grab i { display: block; width: 38px; height: 4px; border-radius: 4px; background: var(--bar-muted); margin: 0 auto; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .sheet-head h3 { font-size: 1.08rem; font-weight: 700; letter-spacing: -0.02em; }
  .sheet-head .cerrar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
  .sheet-head .cerrar .ico { width: 18px; height: 18px; }

  .monto-input { display: flex; align-items: center; justify-content: center; gap: 4px; margin: 16px 0 6px; }
  .monto-input span { font-size: 1.6rem; font-weight: 650; color: var(--text-3); }
  .monto-input input {
    background: none; border: none; box-shadow: none !important; padding: 0; border-radius: 0;
    font-size: 2.5rem; font-weight: 750; letter-spacing: -0.03em; text-align: left;
    width: 2ch; max-width: 240px; -moz-appearance: textfield; appearance: textfield;
  }
  .monto-input input::-webkit-outer-spin-button, .monto-input input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .cats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .cat-op { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 12px; font-size: 0.62rem; letter-spacing: -0.02em; font-weight: 600; color: var(--text-2); min-width: 0; }
  .cat-op span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-op.sel { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--primary); }
  .sheet-acciones { display: flex; gap: 8px; margin-top: 16px; }
  .sheet-acciones .btn-primary { flex: 1; }
  .btn-borrar { width: 50px; border-radius: 14px; display: grid; place-items: center; color: var(--gasto); background: var(--gasto-soft); flex-shrink: 0; }

  .backdrop.centro { align-items: center; padding: 24px; }
  .dialogo {
    background: var(--surface); border-radius: 22px; padding: 20px; width: 100%; max-width: 340px;
    box-shadow: var(--shadow); transform: scale(.96); transition: transform .2s var(--ease);
  }
  .backdrop.open .dialogo { transform: none; }
  .dialogo h3 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; }
  .dialogo p { font-size: 0.88rem; color: var(--text-2); margin-top: 6px; }
  .dialogo-acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
  .dialogo-acciones button { padding: 11px; border-radius: 12px; font-weight: 650; font-size: 0.9rem; }
  .btn-sec { background: var(--surface-2); color: var(--text); }
  .btn-peligro { background: #d32f4f; color: #fff; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 60;
    transform: translateX(-50%) translateY(16px);
    display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px); width: max-content;
    background: #161b2e; color: #fff; padding: 11px 16px; border-radius: 14px;
    font-size: 0.87rem; font-weight: 600; box-shadow: var(--shadow);
    opacity: 0; visibility: hidden; transition: opacity .2s, transform .25s var(--ease), visibility .2s;
  }
  [data-theme="dark"] .toast { background: #2a3147; }
  .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%); }
  .toast button { color: #a9b8ff; font-weight: 700; padding: 2px; }

  /* Pantalla de carga (splash) */
  .splash {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: #000000; color: #fff; text-align: center; padding: 24px;
    transition: opacity .4s ease, visibility .4s ease;
  }
  .splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .splash-logo { width: 92px; height: 92px; animation: splashPop .6s var(--ease) both; }
  .splash-logo svg { width: 100%; height: 100%; }
  .splash-name { font-size: 1.3rem; font-weight: 750; letter-spacing: -0.02em; animation: splashFade .6s .1s ease both; }
  .splash-tag { font-size: 0.88rem; opacity: .88; animation: splashFade .6s .2s ease both; }
  @keyframes splashPop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes splashFade { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

<script>
(function () {
  "use strict";

  // ---------- Categorías ----------
  const CATEGORIAS = {
    gasto: ["Alimentación", "Transporte", "Vivienda", "Servicios", "Salud", "Educación", "Entretenimiento", "Ropa", "Regalos", "Otros"],
    ingreso: ["Salario", "Freelance", "Negocio", "Inversiones", "Regalos", "Otros"]
  };
  const CAT_COLOR = {
    "Alimentación": "#e2622c", "Transporte": "#2a78d6", "Vivienda": "#6250d6", "Servicios": "#c98500",
    "Salud": "#e34948", "Educación": "#148f65", "Entretenimiento": "#d55181", "Ropa": "#0e8fb0",
    "Regalos": "#d55181", "Otros": "#6b7488", "Salario": "#148f65", "Freelance": "#2a78d6",
    "Negocio": "#e2622c", "Inversiones": "#6250d6"
  };

  const CURRENCIES = {
    USD: { locale: "en-US", code: "USD" },
    EUR: { locale: "de-DE", code: "EUR" },
    MXN: { locale: "es-MX", code: "MXN" },
    COP: { locale: "es-CO", code: "COP" },
    ARS: { locale: "es-AR", code: "ARS" },
    CLP: { locale: "es-CL", code: "CLP" },
    PEN: { locale: "es-PE", code: "PEN" },
    GTQ: { locale: "es-GT", code: "GTQ" },
    BOB: { locale: "es-BO", code: "BOB" },
    PYG: { locale: "es-PY", code: "PYG" },
    UYU: { locale: "es-UY", code: "UYU" },
    VES: { locale: "es-VE", code: "VES" },
    NIO: { locale: "es-NI", code: "NIO" },
    CRC: { locale: "es-CR", code: "CRC" },
    PAB: { locale: "es-PA", code: "PAB" },
    DOP: { locale: "es-DO", code: "DOP" }
  };

  const ETIQUETA_CORTA = { "Alimentación": "Comida", "Entretenimiento": "Ocio" };

  const TITULOS = { movimientos: "Movimientos", analisis: "Análisis", ajustes: "Ajustes" };

  // ---------- Estado ----------
  let transacciones = [];
  let settings = { currency: "USD", budget: 0, theme: "light" };
  let periodo = { anio: 0, mes: 0, quincena: 1 }; // { anio, mes(0-11), quincena(1|2) }
  let vista = "inicio";
  let filtro = "todos";
  let busqueda = "";
  let form = { id: null, tipo: "gasto", categoria: "" };
  let ultimoTipo = "gasto";
  let overlay = null;
  let alCerrarOverlay = null;
  let balanceMostrado = 0;
  let animBalance = 0;

  // ---------- Utilidades ----------
  const $ = (id) => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const icono = (n) => `<svg class="ico" aria-hidden="true"><use href="#${n}"/></svg>`;
  const sinAnimacion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function formato(opciones) {
    const c = CURRENCIES[settings.currency] || CURRENCIES.USD;
    return new Intl.NumberFormat(c.locale, Object.assign({ style: "currency", currency: c.code }, opciones));
  }

  function fmt(monto) {
    try {
      return formato({ minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(monto || 0);
    } catch (e) {
      return "$" + (monto || 0).toFixed(2);
    }
  }

  function fmtCorto(monto) {
    try {
      return formato({ notation: "compact", maximumFractionDigits: 1 }).format(monto || 0);
    } catch (e) {
      return "$" + (monto || 0).toFixed(0);
    }
  }

  // Separa el monto en parte principal y decimales, para atenuar los decimales.
  function fmtPartes(monto) {
    try {
      const partes = formato({ minimumFractionDigits: 2, maximumFractionDigits: 2 }).formatToParts(monto || 0);
      const i = partes.findIndex(p => p.type === "decimal");
      if (i < 0) return { entero: fmt(monto), resto: "" };
      const unir = (l) => l.map(p => p.value).join("");
      return { entero: unir(partes.slice(0, i)), resto: unir(partes.slice(i)) };
    } catch (e) {
      return { entero: fmt(monto), resto: "" };
    }
  }

  function simboloMoneda() {
    try {
      const p = formato({}).formatToParts(0).find(x => x.type === "currency");
      return p ? p.value : "$";
    } catch (e) {
      return "$";
    }
  }

  function fechaStr(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function hoyISO() {
    return fechaStr(new Date());
  }

  function quincenaDe(f) {
    const d = new Date(f + "T00:00:00");
    return { anio: d.getFullYear(), mes: d.getMonth(), quincena: d.getDate() <= 15 ? 1 : 2 };
  }

  function rangoPeriodo(p) {
    const inicio = new Date(p.anio, p.mes, p.quincena === 1 ? 1 : 16);
    const fin = p.quincena === 1 ? new Date(p.anio, p.mes, 15) : new Date(p.anio, p.mes + 1, 0);
    return { ini: fechaStr(inicio), fin: fechaStr(fin) };
  }

  function periodoInfo(p) {
    const nombreMes = new Date(p.anio, p.mes, 1).toLocaleDateString("es-ES", { month: "long", year: "numeric" });
    const r = rangoPeriodo(p);
    const diaIni = +r.ini.slice(8, 10);
    const diaFin = +r.fin.slice(8, 10);
    return {
      nombre: p.quincena === 1 ? "1ª quincena" : "2ª quincena",
      rango: nombreMes + " · " + diaIni + "–" + diaFin
    };
  }

  function periodoVecino(p, dir) {
    const n = Object.assign({}, p);
    if (dir > 0) {
      if (n.quincena === 1) n.quincena = 2;
      else { n.quincena = 1; n.mes++; if (n.mes > 11) { n.mes = 0; n.anio++; } }
    } else {
      if (n.quincena === 2) n.quincena = 1;
      else { n.quincena = 2; n.mes--; if (n.mes < 0) { n.mes = 11; n.anio--; } }
    }
    return n;
  }

  const mismoPeriodo = (a, b) => a.anio === b.anio && a.mes === b.mes && a.quincena === b.quincena;

  function diasEntre(ini, fin) {
    return Math.round((new Date(fin + "T00:00:00") - new Date(ini + "T00:00:00")) / 86400000);
  }

  function toast(msg, accion) {
    const t = $("toast");
    t.textContent = msg;
    if (accion) {
      const b = document.createElement("button");
      b.textContent = accion.texto;
      b.addEventListener("click", () => { t.classList.remove("show"); accion.fn(); });
      t.appendChild(b);
    }
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), accion ? 5000 : 2200);
  }

  // ---------- Persistencia ----------
  function save() {
    try {
      localStorage.setItem("finanzas_transacciones", JSON.stringify(transacciones));
      localStorage.setItem("finanzas_settings", JSON.stringify(settings));
    } catch (e) { console.warn("No se pudo guardar", e); }
  }

  function load() {
    try {
      const t = localStorage.getItem("finanzas_transacciones");
      const s = localStorage.getItem("finanzas_settings");
      if (t) transacciones = JSON.parse(t);
      if (s) settings = Object.assign({}, settings, JSON.parse(s));
    } catch (e) { console.warn("No se pudo cargar", e); }
    if (!Array.isArray(transacciones)) transacciones = [];
  }

  // ---------- Filtrado ----------
  function txnsDe(p) {
    const r = rangoPeriodo(p);
    return transacciones.filter(t => t.fecha && t.fecha >= r.ini && t.fecha <= r.fin);
  }

  function txnsDelPeriodo() {
    return txnsDe(periodo);
  }

  function totalGastos(lista) {
    return lista.filter(t => t.tipo === "gasto").reduce((s, t) => s + (+t.monto), 0);
  }

  function aplicarFiltros(lista) {
    return lista.filter(t => {
      if (filtro !== "todos" && t.tipo !== filtro) return false;
      if (busqueda) {
        const q = busqueda.toLowerCase();
        if (!(t.descripcion || "").toLowerCase().includes(q) && !(t.categoria || "").toLowerCase().includes(q)) return false;
      }
      return true;
    });
  }

  function ordenarRecientes(lista) {
    return lista.slice().sort((a, b) => (a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0));
  }

  function gastosPorCategoria(lista) {
    const porCat = {};
    lista.filter(t => t.tipo === "gasto").forEach(t => { porCat[t.categoria] = (porCat[t.categoria] || 0) + (+t.monto); });
    const total = Object.values(porCat).reduce((a, b) => a + b, 0);
    return Object.entries(porCat).map(([cat, monto]) => ({
      cat, monto, pct: total ? (monto / total) * 100 : 0
    })).sort((a, b) => b.monto - a.monto);
  }

  // ---------- Render ----------
  function render() {
    renderEncabezado();
    renderSummary();
    renderBudget();
    renderTopCats();
    renderRecientes();
    renderList();
    renderAnalisis();
    renderAjustes();
  }

  function renderEncabezado() {
    if (vista === "inicio") {
      const h = new Date().getHours();
      $("titulo").textContent = h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches";
      $("subtitulo").textContent = new Date().toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
    } else {
      $("titulo").textContent = TITULOS[vista];
      $("subtitulo").textContent = "";
    }
    $("periodoNav").classList.toggle("hidden", vista === "ajustes");
    const info = periodoInfo(periodo);
    $("periodoNombre").textContent = info.nombre;
    $("periodoRango").textContent = info.rango;
    $("btnToday").classList.toggle("hidden", mismoPeriodo(periodo, quincenaDe(hoyISO())));
  }

  function pintarBalance(valor) {
    const p = fmtPartes(valor);
    const el = $("sumBalance");
    el.innerHTML = escapeHtml(p.entero) + "<small>" + escapeHtml(p.resto) + "</small>";
    el.classList.toggle("largo", (p.entero + p.resto).length > 11);
    balanceMostrado = valor;
  }

  function animarBalance(destino) {
    cancelAnimationFrame(animBalance);
    const inicio = balanceMostrado;
    if (sinAnimacion() || inicio === destino) { pintarBalance(destino); return; }
    const t0 = performance.now();
    const paso = (t) => {
      const k = Math.min(1, (t - t0) / 420);
      pintarBalance(k < 1 ? inicio + (destino - inicio) * (1 - Math.pow(1 - k, 3)) : destino);
      if (k < 1) animBalance = requestAnimationFrame(paso);
    };
    pintarBalance(inicio);
    animBalance = requestAnimationFrame(paso);
  }

  function renderSummary() {
    const lista = txnsDelPeriodo();
    let ingresos = 0, gastos = 0;
    lista.forEach(t => { if (t.tipo === "ingreso") ingresos += +t.monto; else gastos += +t.monto; });
    const balance = ingresos - gastos;

    animarBalance(balance);
    [["sumIngresos", ingresos], ["sumGastos", gastos]].forEach(([id, v]) => {
      $(id).textContent = fmt(v);
      $(id).classList.toggle("largo", fmt(v).length > 11);
    });

    let estado = "Aún no hay movimientos en esta quincena";
    if (balance < 0) estado = "Gastaste " + fmt(-balance) + " más de lo que entró";
    else if (ingresos > 0) estado = "Conservas el " + Math.round((balance / ingresos) * 100) + "% de lo que entró";
    $("subBalance").textContent = estado;
  }

  function renderBudget() {
    const card = $("budgetCard");
    const budget = +settings.budget || 0;

    if (!budget) {
      card.innerHTML = `
        <button class="budget-vacio" data-ir="ajustes">
          <span class="tile-ico">${icono("i-meta")}</span>
          <span class="txt"><span class="t">Define un presupuesto</span><span class="s">Te digo cuánto puedes gastar por día</span></span>
          ${icono("i-der")}
        </button>`;
      return;
    }

    const gastos = totalGastos(txnsDelPeriodo());
    const restante = budget - gastos;
    const pct = (gastos / budget) * 100;
    const estado = pct >= 100 ? "over" : pct >= 80 ? "warn" : "";
    const r = rangoPeriodo(periodo);
    const hoy = hoyISO();
    const enCurso = hoy >= r.ini && hoy <= r.fin;

    let detalle = fmt(gastos) + " de " + fmt(budget);
    if (enCurso && restante > 0) {
      const dias = diasEntre(hoy, r.fin) + 1;
      detalle = "Unos " + fmt(restante / dias) + " al día · " + (dias === 1 ? "último día" : dias + " días restantes");
    }

    card.innerHTML = `
      <div class="budget-top">
        <span class="t">${restante >= 0 ? "Te quedan " + fmt(restante) : "Te pasaste por " + fmt(-restante)}</span>
        <span class="p ${estado}">${Math.round(pct)}%</span>
      </div>
      <div class="bar"><div class="fill ${estado}" style="width:${Math.min(100, pct)}%"></div></div>
      <div class="budget-sub">${detalle}</div>`;
  }

  function filaCategoria(d) {
    return `
      <div class="cat-row">
        <div class="top">
          ${iconoCategoria(d.cat)}
          <span class="nombre">${escapeHtml(d.cat)}</span>
          <span class="amt">${fmt(d.monto)}</span>
          <span class="pct">${d.pct.toFixed(0)}%</span>
        </div>
        <div class="bar"><div class="fill" style="width:${d.pct}%"></div></div>
      </div>`;
  }

  function renderTopCats() {
    const datos = gastosPorCategoria(txnsDelPeriodo());
    $("topCatsCard").classList.toggle("hidden", !datos.length);
    $("topCats").innerHTML = datos.slice(0, 3).map(filaCategoria).join("");
  }

  function iconoCategoria(cat) {
    const nombre = CAT_COLOR[cat] ? cat : "Otros";
    return `<span class="cat-ico" style="--c:${CAT_COLOR[nombre]}">${icono("c-" + nombre)}</span>`;
  }

  function filaTxn(t, conFecha) {
    const signo = t.tipo === "ingreso" ? "+" : "−";
    const meta = escapeHtml(t.categoria) + (conFecha ? " · " + formatFecha(t.fecha) : "");
    return `
      <button class="txn" data-id="${escapeHtml(t.id)}">
        ${iconoCategoria(t.categoria)}
        <span class="info">
          <span class="desc">${escapeHtml(t.descripcion || "Sin descripción")}</span>
          <span class="meta">${meta}</span>
        </span>
        <span class="amount ${t.tipo}">${signo}${fmt(t.monto)}</span>
      </button>`;
  }

  function vacio(titulo, texto, conBoton) {
    return `
      <div class="vacio">
        <div class="tile-ico">${icono("i-lista")}</div>
        <strong>${titulo}</strong>
        ${texto}
        ${conBoton ? '<br><button class="btn-primary" data-nuevo>Añadir movimiento</button>' : ""}
      </div>`;
  }

  function renderRecientes() {
    const lista = ordenarRecientes(txnsDelPeriodo());
    $("linkTodos").classList.toggle("hidden", lista.length <= 5);
    $("recientes").innerHTML = lista.length
      ? lista.slice(0, 5).map(t => filaTxn(t, true)).join("")
      : vacio("Empieza a registrar", "Tu primer movimiento aparecerá aquí.", true);
  }

  function nombreDia(f) {
    const hoy = hoyISO();
    if (f === hoy) return "Hoy";
    if (diasEntre(f, hoy) === 1) return "Ayer";
    return new Date(f + "T00:00:00").toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "short" });
  }

  function renderList() {
    const cont = $("txnList");
    const lista = ordenarRecientes(aplicarFiltros(txnsDelPeriodo()));

    if (!lista.length) {
      cont.innerHTML = busqueda || filtro !== "todos"
        ? vacio("Sin resultados", "Prueba con otra búsqueda o filtro.", false)
        : vacio("No hay movimientos", "Esta quincena todavía está en blanco.", true);
      return;
    }

    const dias = [];
    lista.forEach(t => {
      const ult = dias[dias.length - 1];
      if (ult && ult.fecha === t.fecha) ult.txns.push(t);
      else dias.push({ fecha: t.fecha, txns: [t] });
    });

    cont.innerHTML = dias.map(d => {
      const neto = d.txns.reduce((s, t) => s + (t.tipo === "ingreso" ? +t.monto : -t.monto), 0);
      return `
        <div class="dia"><span>${escapeHtml(nombreDia(d.fecha))}</span><span>${neto >= 0 ? "+" : "−"}${fmt(Math.abs(neto))}</span></div>
        ${d.txns.map(t => filaTxn(t, false)).join("")}`;
    }).join("");
  }

  function renderAnalisis() {
    const lista = txnsDelPeriodo();
    const gastos = lista.filter(t => t.tipo === "gasto");
    const hayGastos = gastos.length > 0;

    $("analisisDatos").classList.toggle("hidden", !hayGastos);
    $("analisisVacio").classList.toggle("hidden", hayGastos);
    if (!hayGastos) {
      $("analisisVacio").innerHTML = vacio("Sin gastos en esta quincena", "Añade un gasto para ver el desglose.", false);
    } else {
      const total = totalGastos(lista);
      const r = rangoPeriodo(periodo);
      const hoy = hoyISO();
      const enCurso = hoy >= r.ini && hoy <= r.fin;
      const dias = diasEntre(r.ini, enCurso ? hoy : r.fin) + 1;
      const mayor = gastos.reduce((a, b) => (+b.monto > +a.monto ? b : a));

      $("statPromedio").textContent = fmt(total / dias);
      $("statPromedioSub").textContent = dias === 1 ? "en 1 día" : "en " + dias + " días";
      $("statMayor").textContent = fmt(mayor.monto);
      $("statMayorSub").textContent = mayor.descripcion || mayor.categoria;

      const anterior = totalGastos(txnsDe(periodoVecino(periodo, -1)));
      $("comparaCard").classList.toggle("hidden", !anterior);
      if (anterior) {
        const cambio = Math.round(((total - anterior) / anterior) * 100);
        const c = $("compara");
        const verbo = enCurso ? "Llevas " : "Gastaste ";
        c.className = "compara " + (cambio <= 0 ? "menos" : "mas");
        c.innerHTML = icono(cambio <= 0 ? "i-entra" : "i-sale") + "<span>" +
          (cambio === 0 ? verbo + "lo mismo que la quincena anterior"
            : verbo + Math.abs(cambio) + "% " + (cambio < 0 ? "menos" : "más") + " que la quincena anterior") + "</span>";
      }

      $("chartArea").innerHTML = gastosPorCategoria(lista).map(filaCategoria).join("");
    }

    renderTendencia();
  }

  function renderTendencia() {
    const puntos = [];
    let p = periodo;
    for (let i = 0; i < 6; i++) {
      puntos.unshift({ p, total: totalGastos(txnsDe(p)) });
      p = periodoVecino(p, -1);
    }
    const max = Math.max(...puntos.map(x => x.total), 1);

    $("tendencia").innerHTML = puntos.map((x, i) => {
      const sel = i === puntos.length - 1;
      const mes = new Date(x.p.anio, x.p.mes, 1).toLocaleDateString("es-ES", { month: "short" }).replace(".", "");
      const nombre = (x.p.quincena === 1 ? "1ª" : "2ª") + " " + mes;
      return `
        <button class="tend-col ${sel ? "sel" : ""}" data-periodo="${x.p.anio}-${x.p.mes}-${x.p.quincena}"
          aria-label="${nombre}: ${fmt(x.total)}">
          ${sel ? `<span class="val">${fmtCorto(x.total)}</span>` : ""}
          <span class="barra" style="height:${(x.total / max) * 84}px"></span>
          <span class="lbl">${x.p.quincena === 1 ? "1ª" : "2ª"}<br>${mes}</span>
        </button>`;
    }).join("");
  }

  function renderAjustes() {
    $("setCurrency").value = settings.currency;
    if (document.activeElement !== $("setBudget")) $("setBudget").value = settings.budget || "";
    $("infoDatos").textContent = "Tus datos se guardan solo en este dispositivo · " + transacciones.length +
      (transacciones.length === 1 ? " movimiento" : " movimientos");
    $("infoRespaldo").textContent = settings.ultimoRespaldo
      ? "Último respaldo: " + new Date(settings.ultimoRespaldo).toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" })
      : "Aún no has hecho ningún respaldo";
  }

  function formatFecha(f) {
    if (!f) return "";
    const d = new Date(f + "T00:00:00");
    return d.toLocaleDateString("es-ES", { day: "numeric", month: "short" });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------- Navegación entre secciones ----------
  function irA(nombre) {
    vista = nombre;
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("activa", v.dataset.view === nombre));
    document.querySelectorAll(".tab").forEach(t => {
      const activa = t.dataset.tab === nombre;
      t.classList.toggle("activa", activa);
      if (activa) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    window.scrollTo(0, 0);
    renderEncabezado();
  }

  $("tabbar").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]");
    if (b) irA(b.dataset.tab);
  });

  document.body.addEventListener("click", (e) => {
    const ir = e.target.closest("[data-ir]");
    if (ir) { irA(ir.dataset.ir); return; }
    if (e.target.closest("[data-nuevo]")) { abrirNuevo(); return; }
    const fila = e.target.closest("[data-id]");
    if (fila) { abrirEditar(fila.dataset.id); return; }
    const col = e.target.closest("[data-periodo]");
    if (col) {
      const [anio, mes, quincena] = col.dataset.periodo.split("-").map(Number);
      periodo = { anio, mes, quincena };
      render();
    }
  });

  // ---------- Hojas y diálogos ----------
  // Cada uno añade una entrada al historial para que el botón atrás lo cierre.
  function abrirOverlay(el, alCerrar) {
    overlay = el;
    alCerrarOverlay = alCerrar || null;
    el.classList.add("open");
    document.body.classList.add("bloqueado");
    history.pushState({ overlay: true }, "");
  }

  function cerrarOverlay() {
    if (overlay) history.back();
  }

  window.addEventListener("popstate", () => {
    if (!overlay) return;
    const fn = alCerrarOverlay;
    overlay.classList.remove("open");
    document.body.classList.remove("bloqueado");
    overlay = null;
    alCerrarOverlay = null;
    if (fn) fn();
  });

  document.querySelectorAll(".backdrop").forEach(b => {
    b.addEventListener("click", (e) => {
      if (e.target === b || e.target.closest("[data-cerrar]")) cerrarOverlay();
    });
  });

  // Deslizar hacia abajo desde el asa cierra la hoja.
  (function () {
    const grab = $("sheetGrab");
    const hoja = grab.parentElement;
    let inicioY = null, delta = 0;
    grab.addEventListener("touchstart", (e) => { inicioY = e.touches[0].clientY; delta = 0; hoja.style.transition = "none"; });
    grab.addEventListener("touchmove", (e) => {
      delta = Math.max(0, e.touches[0].clientY - inicioY);
      hoja.style.transform = "translateY(" + delta + "px)";
    });
    grab.addEventListener("touchend", () => {
      hoja.style.transition = "";
      hoja.style.transform = "";
      if (delta > 90) cerrarOverlay();
    });
  })();

  function confirmar(titulo, texto, boton, peligro) {
    return new Promise((resolve) => {
      let aceptado = false;
      const ok = $("confirmOk");
      $("confirmTitulo").textContent = titulo;
      $("confirmTexto").textContent = texto;
      ok.textContent = boton;
      ok.className = peligro ? "btn-peligro" : "btn-primary";
      ok.onclick = () => { aceptado = true; cerrarOverlay(); };
      abrirOverlay($("confirmDlg"), () => resolve(aceptado));
    });
  }

  // ---------- Formulario de movimiento ----------
  function pintarTipo() {
    $("typeSeg").querySelectorAll("button").forEach(b => {
      const active = b.dataset.tipo === form.tipo;
      b.classList.toggle("active", active);
      b.classList.toggle("ingreso", active && form.tipo === "ingreso");
      b.classList.toggle("gasto", active && form.tipo === "gasto");
    });
  }

  function pintarCategorias() {
    const base = CATEGORIAS[form.tipo] || CATEGORIAS.gasto;
    const cats = base.includes(form.categoria) ? base : base.concat(form.categoria);
    $("fCats").innerHTML = cats.map(c => `
      <button type="button" class="cat-op ${c === form.categoria ? "sel" : ""}" data-cat="${escapeHtml(c)}" aria-label="${escapeHtml(c)}" aria-pressed="${c === form.categoria}">
        ${iconoCategoria(c)}
        <span>${escapeHtml(ETIQUETA_CORTA[c] || c)}</span>
      </button>`).join("");
  }

  // El ancho sigue al texto para que el símbolo quede pegado al monto.
  function ajustarMonto() {
    $("fMonto").style.width = Math.max(1, $("fMonto").value.length) + 1 + "ch";
  }
  $("fMonto").addEventListener("input", ajustarMonto);

  // Hoy si se está viendo la quincena en curso; si no, el primer día de la que se ve.
  function fechaPorDefecto() {
    const hoy = hoyISO();
    const r = rangoPeriodo(periodo);
    return hoy >= r.ini && hoy <= r.fin ? hoy : r.ini;
  }

  function abrirNuevo() {
    form = { id: null, tipo: ultimoTipo, categoria: CATEGORIAS[ultimoTipo][0] };
    $("sheetTitulo").textContent = "Nuevo movimiento";
    $("fMonto").value = "";
    $("fDesc").value = "";
    $("fFecha").value = fechaPorDefecto();
    $("btnEliminar").classList.add("hidden");
    $("fSimbolo").textContent = simboloMoneda();
    pintarTipo();
    pintarCategorias();
    ajustarMonto();
    abrirOverlay($("txnSheet"));
  }

  function abrirEditar(id) {
    const t = transacciones.find(x => x.id === id);
    if (!t) return;
    form = { id, tipo: t.tipo, categoria: t.categoria };
    $("sheetTitulo").textContent = "Editar movimiento";
    $("fMonto").value = t.monto;
    $("fDesc").value = t.descripcion || "";
    $("fFecha").value = t.fecha;
    $("btnEliminar").classList.remove("hidden");
    $("fSimbolo").textContent = simboloMoneda();
    pintarTipo();
    pintarCategorias();
    ajustarMonto();
    abrirOverlay($("txnSheet"));
  }

  $("btnNuevo").addEventListener("click", abrirNuevo);

  $("typeSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-tipo]");
    if (!b || b.dataset.tipo === form.tipo) return;
    form.tipo = b.dataset.tipo;
    form.categoria = CATEGORIAS[form.tipo][0];
    pintarTipo();
    pintarCategorias();
  });

  $("fCats").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-cat]");
    if (!b) return;
    form.categoria = b.dataset.cat;
    pintarCategorias();
  });

  $("txnForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const monto = parseFloat($("fMonto").value);
    if (!monto || monto <= 0) { toast("Introduce un monto válido"); return; }
    const fecha = $("fFecha").value;
    if (!fecha) { toast("Elige una fecha"); return; }

    const datos = {
      tipo: form.tipo,
      descripcion: $("fDesc").value.trim() || form.categoria,
      monto: Math.round(monto * 100) / 100,
      categoria: form.categoria,
      fecha
    };

    if (form.id) {
      const t = transacciones.find(x => x.id === form.id);
      if (!t) return;
      Object.assign(t, datos);
    } else {
      transacciones.push(Object.assign({ id: uid() }, datos));
      ultimoTipo = form.tipo;
    }
    save();
    // Si la fecha es de otra quincena, saltar a esa quincena
    const q = quincenaDe(fecha);
    if (!mismoPeriodo(q, periodo)) periodo = q;
    const msg = form.id ? "Movimiento actualizado" : "Movimiento guardado";
    cerrarOverlay();
    render();
    toast(msg);
  });

  $("btnEliminar").addEventListener("click", () => {
    const i = transacciones.findIndex(x => x.id === form.id);
    if (i < 0) return;
    const [t] = transacciones.splice(i, 1);
    save();
    cerrarOverlay();
    render();
    toast("Movimiento eliminado", {
      texto: "Deshacer",
      fn: () => { transacciones.splice(i, 0, t); save(); render(); }
    });
  });

  // ---------- Filtros y búsqueda ----------
  $("filterSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-filtro]");
    if (!b) return;
    filtro = b.dataset.filtro;
    $("filterSeg").querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
    renderList();
  });

  $("searchInput").addEventListener("input", (e) => {
    busqueda = e.target.value.trim();
    renderList();
  });

  // ---------- Navegación de quincena ----------
  $("prevMonth").addEventListener("click", () => { periodo = periodoVecino(periodo, -1); render(); });
  $("nextMonth").addEventListener("click", () => { periodo = periodoVecino(periodo, 1); render(); });
  $("btnToday").addEventListener("click", () => { periodo = quincenaDe(hoyISO()); render(); });

  // ---------- Exportar / Importar ----------
  function marcarRespaldo() {
    settings.ultimoRespaldo = new Date().toISOString();
    save();
    renderAjustes();
    toast("Respaldo exportado");
  }

  function descargar(blob, nombre) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nombre;
    a.click();
    URL.revokeObjectURL(url);
    marcarRespaldo();
  }

  $("btnExport").addEventListener("click", async () => {
    const data = { version: 1, exportado: new Date().toISOString(), moneda: settings.currency, transacciones };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const nombre = "finanzas-" + fechaStr(new Date()) + ".json";
    const archivo = new File([blob], nombre, { type: "application/json" });

    if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
      try {
        await navigator.share({ files: [archivo], title: "Respaldo de Finanzas" });
        marcarRespaldo();
      } catch (err) {
        if (err.name !== "AbortError") descargar(blob, nombre);
      }
      return;
    }
    descargar(blob, nombre);
  });

  $("btnImport").addEventListener("click", () => $("fileInput").click());

  $("fileInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(reader.result);
        const lista = Array.isArray(data) ? data : data.transacciones;
        if (!Array.isArray(lista)) throw new Error("Formato inválido");
        const existentes = new Set(transacciones.map(t => t.id));
        const nuevas = lista.filter(t => !t.id || !existentes.has(t.id));
        if (!nuevas.length) { toast("Ese respaldo ya está importado"); return; }
        if (!await confirmar("Importar respaldo", `Se agregarán ${nuevas.length} movimientos a los que ya tienes.`, "Importar")) return;
        transacciones = transacciones.concat(nuevas.map(t => ({ id: t.id || uid(), tipo: t.tipo || "gasto", descripcion: t.descripcion || "Sin descripción", monto: +t.monto || 0, categoria: t.categoria || "Otros", fecha: t.fecha })));
        save();
        render();
        toast("Importación completada");
      } catch (err) {
        toast("No se pudo importar el archivo");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  // ---------- Ajustes ----------
  $("setCurrency").addEventListener("change", () => {
    settings.currency = $("setCurrency").value;
    save();
    render();
  });

  $("setBudget").addEventListener("input", () => {
    settings.budget = parseFloat($("setBudget").value) || 0;
    save();
    renderBudget();
  });

  $("btnClearAll").addEventListener("click", async () => {
    if (!transacciones.length) { toast("No hay movimientos que borrar"); return; }
    const ok = await confirmar("¿Borrar todos los movimientos?", "Se eliminarán " + transacciones.length + " movimientos de este dispositivo. Esta acción no se puede deshacer.", "Borrar todo", true);
    if (!ok) return;
    transacciones = [];
    save();
    render();
    toast("Todos los datos fueron eliminados");
  });

  // ---------- Tema ----------
  function aplicarTema() {
    const oscuro = settings.theme === "dark";
    document.documentElement.setAttribute("data-theme", settings.theme);
    $("metaTheme").setAttribute("content", oscuro ? "#0b0e17" : "#f4f5f9");
    $("btnTheme").innerHTML = icono(oscuro ? "i-sol" : "i-luna");
    $("themeSwitch").classList.toggle("on", oscuro);
    $("btnThemeAjuste").setAttribute("aria-checked", String(oscuro));
  }

  function cambiarTema() {
    settings.theme = settings.theme === "dark" ? "light" : "dark";
    save();
    aplicarTema();
  }
  $("btnTheme").addEventListener("click", cambiarTema);
  $("btnThemeAjuste").addEventListener("click", cambiarTema);

  // ---------- Inicio ----------
  load();
  periodo = quincenaDe(hoyISO());
  aplicarTema();
  irA("inicio");
  render();

  // ---------- Pantalla de carga ----------
  setTimeout(() => {
    const s = $("splash");
    if (s) s.classList.add("hide");
  }, 700);

  // ---------- Service Worker (solo PWA, no en la app nativa) ----------
  if ("serviceWorker" in navigator && location.protocol.startsWith("http") && typeof window.Capacitor === "undefined") {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
})();
</script>
</body>
</html>
